<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور | NAVITO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .reset-card { background: var(--card-bg); padding: 2.5rem; border-radius: var(--radius-lg); width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); border: 1px solid var(--border-color); text-align: center; }
        h2 { margin-bottom: 1rem; color: var(--accent-color); }
        .form-group { margin-bottom: 1.5rem; text-align: right; }
        .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); }
        .form-input { width: 100%; padding: 0.8rem 1rem; border-radius: 50px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .auth-btn { width: 100%; padding: 1rem; border-radius: 50px; border: none; background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: white; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 1rem; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>تغيير كلمة المرور</h2>
        <p style="margin-bottom: 2rem; color: var(--text-secondary); font-size: 0.9rem;">أدخل كلمة المرور الجديدة لحسابك</p>
        
        <form id="reset-form">
            <div class="form-group">
                <label class="form-label">كلمة المرور الجديدة</label>
                <input type="password" id="new-password" class="form-input" placeholder="••••••••" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">تأكيد كلمة المرور</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="auth-btn">حفظ كلمة المرور</button>
        </form>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                showToast('كلمتا المرور غير متطابقتين', 'error');
                return;
            }

            try {
                const { error } = await window.supabase.auth.updateUser({ password });
                if (error) throw error;
                
                showToast('تم تغيير كلمة المرور بنجاح!', 'success');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
