<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | NAVITO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Theme & Language Persistence Script - Prevents Flash -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.className = savedTheme + '-mode';

            const savedLang = localStorage.getItem('navito_language') || 'ar';
            document.documentElement.lang = savedLang;

            if (savedLang === 'en') {
                document.write('<style id="i18n-hide-body">body { opacity: 0 !important; }</style>');
                setTimeout(function () {
                    document.documentElement.classList.add('i18n-ready');
                }, 1500);
            } else {
                document.documentElement.classList.add('i18n-ready');
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 2rem;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 0 40px rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 50px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            transition: var(--transition);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Fix autofill styling */
        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-primary) !important;
            -webkit-box-shadow: 0 0 0 1000px var(--bg-secondary) inset !important;
            box-shadow: 0 0 0 1000px var(--bg-secondary) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="position: absolute; top: 20px; left: 20px; display: flex; gap: 10px;">
                <button onclick="toggleTheme()" class="icon-btn"
                    style="background:none; border:none; cursor:pointer; font-size:1.2rem;" title="تغيير الوضع">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>
            <a href="index.html"
                style="position: absolute; top: 20px; right: 20px; color: var(--text-secondary); font-size: 0.9rem; text-decoration:none;"
                title="عودة للرئيسية">✕</a>
            <div class="auth-header">
                <h2>إنشاء حساب جديد</h2>
                <p style="color: var(--text-primary); font-weight: 600; opacity: 0.9;">انضم إلينا اليوم لتجربة تسوق فاخرة</p>
            </div>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">الاسم الكامل</label>
                    <input type="text" id="fullname" class="form-input" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-input" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">رقم الهاتف</label>
                    <input type="tel" id="phone" class="form-input" placeholder="06 XX XX XX XX" required>
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required
                        minlength="6">
                </div>

                <button type="submit" class="auth-btn">إنشاء الحساب</button>
                <div style="text-align: center; margin: 1.5rem 0; color: var(--text-secondary); font-size: 0.9rem; position: relative;">
                    <span style="background: var(--card-bg); padding: 0 1rem; position: relative; z-index: 1;">أو</span>
                    <hr style="position: absolute; top: 50%; left: 0; width: 100%; border: 0; border-top: 1px solid var(--border-color); margin: 0;">
                </div>
                <button type="button" onclick="handleGoogleLogin()" class="auth-btn" style="background: white; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 0;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
                    التسجيل عبر جوجل
                </button>
            </form>
            <div class="auth-footer">
                لديك حساب بالفعل؟ <a href="login.html" class="auth-link">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script src="app.js"></script>
    <script>
        // Theme Logic
        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark-mode');
            root.classList.toggle('light-mode');
            const isDark = root.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        // Init Theme UI State
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const isDark = savedTheme === 'dark';
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';

            // Auto-redirect if logged in (especially for Google OAuth callback)
            if (window.supabase) {
                window.supabase.auth.onAuthStateChange(async (event, session) => {
                    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
                        try {
                            await fetch('/api/ensure-profile', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${session.access_token}`
                                }
                            });
                        } catch (e) {}
                        // Always redirect to main page
                        window.location.href = 'index.html';
                    }
                });
            }
        });

        async function handleRegister(e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = e.target.querySelector('button[type="submit"]');

            // Validation
            if (password !== confirmPassword) {
                showToast('كلمتا المرور غير متطابقتين', 'error');
                return;
            }

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
                }

                if (typeof Utils !== 'undefined' && Utils.register) {
                    const result = await Utils.register({ fullname, email, phone, password });
                    
                    if (result.session) {
                        showToast('تم إنشاء الحساب بنجاح! جاري الدخول...', 'success');
                    } else {
                        // Even if confirmation is required, we'll try to show them the home page
                        showToast('تم إنشاء الحساب بنجاح! مرحباً بك في نافيتو', 'success');
                    }

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            } catch (error) {
                showToast(error.message || 'حدث خطأ أثناء التسجيل', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'إنشاء الحساب';
                }
            }
        }

        async function handleGoogleLogin() {
            try {
                if (typeof Utils !== 'undefined' && Utils.loginWithGoogle) {
                    await Utils.loginWithGoogle();
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>

</html>
