<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | NAVITO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Theme & Language Persistence Script - Prevents Flash -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.className = savedTheme + '-mode';

            const savedLang = localStorage.getItem('navito_language') || 'ar';
            document.documentElement.lang = savedLang;

            if (savedLang === 'en') {
                document.write('<style id="i18n-hide-body">body { opacity: 0 !important; }</style>');
                setTimeout(function () {
                    document.documentElement.classList.add('i18n-ready');
                }, 1500);
            } else {
                document.documentElement.classList.add('i18n-ready');
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .auth-container {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 2rem;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 0 40px rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 50px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Fix autofill styling */
        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-primary) !important;
            -webkit-box-shadow: 0 0 0 1000px var(--bg-secondary) inset !important;
            box-shadow: 0 0 0 1000px var(--bg-secondary) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent-color);
            font-weight: 600;
        }

        .back-home {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="position: absolute; top: 20px; left: 20px; display: flex; gap: 10px;">
                <button onclick="toggleTheme()" class="icon-btn"
                    style="background:none; border:none; cursor:pointer; font-size:1.2rem;" title="تغيير الوضع">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>
            <a href="/" class="back-home" title="عودة للرئيسية">✕</a>
            <div class="auth-header">
                <h2>مرحباً بعودتك</h2>
                <p style="color: var(--text-secondary);">سجل دخولك للمتابعة</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="login-email" class="form-input" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin: 0;">
                        <input type="checkbox" style="width: auto; margin: 0;"> تذكرني
                    </label>
                    <a href="#" class="auth-link" style="font-size: 0.85rem;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="auth-btn">تسجيل الدخول</button>
            </form>
            <div class="auth-footer">
                ليس لديك حساب؟ <a href="/register" class="auth-link">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script src="app.js"></script>
    <script>
        // Theme Logic
        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark-mode');
            root.classList.toggle('light-mode');
            const isDark = root.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        // Init Theme UI State (Class already applied by Head Script)
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const isDark = savedTheme === 'dark';
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        });

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = e.target.querySelector('button[type="submit"]');

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
                }

                if (typeof Utils !== 'undefined' && Utils.login) {
                    const user = await Utils.login(email, password);
                    showToast('مرحباً ' + user.fullname, 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            } catch (error) {
                showToast(error.message || 'البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'تسجيل الدخول';
                }
            }
        }
    </script>
</body>

</html>
