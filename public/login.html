<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | NAVITO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Theme & Language Persistence Script - Prevents Flash -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.className = savedTheme + '-mode';

            const savedLang = localStorage.getItem('navito_language') || 'ar';
            document.documentElement.lang = savedLang;

            if (savedLang === 'en') {
                document.write('<style id="i18n-hide-body">body { opacity: 0 !important; }</style>');
                setTimeout(function () {
                    document.documentElement.classList.add('i18n-ready');
                }, 1500);
            } else {
                document.documentElement.classList.add('i18n-ready');
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .auth-container {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 2rem;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 0 40px rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-color), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 50px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Fix autofill styling */
        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-primary) !important;
            -webkit-box-shadow: 0 0 0 1000px var(--bg-secondary) inset !important;
            box-shadow: 0 0 0 1000px var(--bg-secondary) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--accent-color);
            font-weight: 600;
        }

        .back-home {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="position: absolute; top: 20px; left: 20px; display: flex; gap: 10px;">
                <button onclick="toggleTheme()" class="icon-btn"
                    style="background:none; border:none; cursor:pointer; font-size:1.2rem;" title="تغيير الوضع">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>
            <a href="index.html" class="back-home" title="عودة للرئيسية">✕</a>
            <div class="auth-header">
                <h2>مرحباً بعودتك</h2>
                <p style="color: var(--text-secondary);">سجل دخولك للمتابعة</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="text" id="login-email" class="form-input" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin: 0;">
                        <input type="checkbox" style="width: auto; margin: 0;"> تذكرني
                    </label>
                    <a href="javascript:void(0)" onclick="handleForgotPassword()" class="auth-link" style="font-size: 0.85rem;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="auth-btn">تسجيل الدخول</button>
                <div style="text-align: center; margin: 1.5rem 0; color: var(--text-secondary); font-size: 0.9rem; position: relative;">
                    <span style="background: var(--card-bg); padding: 0 1rem; position: relative; z-index: 1;">أو</span>
                    <hr style="position: absolute; top: 50%; left: 0; width: 100%; border: 0; border-top: 1px solid var(--border-color); margin: 0;">
                </div>
                <button type="button" onclick="handleGoogleLogin()" class="auth-btn" style="background: white; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 0;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
                    تسجيل الدخول عبر جوجل
                </button>
            </form>
            <div class="auth-footer">
                ليس لديك حساب؟ <a href="register.html" class="auth-link">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="modal-overlay">
        <div class="auth-card" style="max-width: 400px; padding: 2rem;">
            <div class="auth-header" style="margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent-color);">استعادة كلمة المرور</h3>
                <p style="font-size: 0.9rem; color: var(--text-secondary);">أدخل بريدك لتصلك رسالة إعادة التعيين</p>
            </div>
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="forgot-email" class="form-input" placeholder="example@mail.com">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button onclick="closeForgotModal()" class="auth-btn" style="background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); margin-top:0;">إلغاء</button>
                <button onclick="submitForgotPassword()" class="auth-btn" style="margin-top:0;">إرسال</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script src="app.js"></script>
    <script>
        // Theme Logic
        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark-mode');
            root.classList.toggle('light-mode');
            const isDark = root.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        // Init Theme UI State (Class already applied by Head Script)
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const isDark = savedTheme === 'dark';
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        });

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = e.target.querySelector('button[type="submit"]');

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
                }

                // Hardcoded Admin Login (Merging admin-login.html logic)
                if (email.toLowerCase() === 'admin' && password === 'admin123') {
                    localStorage.setItem('admin_token', 'demo_token_v1');
                    localStorage.setItem('navito_current_user', JSON.stringify({
                        fullname: 'Admin Panel',
                        role: 'admin',
                        email: 'admin@navito.store'
                    }));
                    showToast('تم تسجيل دخول المشرف بنجاح', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                    return;
                }

                if (typeof Utils !== 'undefined' && Utils.login) {
                    const user = await Utils.login(email, password);
                    showToast('مرحباً ' + user.fullname, 'success');
                    setTimeout(() => {
                        if (user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                }
            } catch (error) {
                showToast(error.message || 'البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'تسجيل الدخول';
                }
            }
        }

        function handleForgotPassword() {
            const modal = document.getElementById('forgot-password-modal');
            if (modal) modal.classList.add('active');
        }

        function closeForgotModal() {
            const modal = document.getElementById('forgot-password-modal');
            if (modal) modal.classList.remove('active');
        }

        async function submitForgotPassword() {
            const email = document.getElementById('forgot-email').value;
            if (!email) {
                showToast('يرجى إدخال البريد الإلكتروني', 'error');
                return;
            }

            try {
                if (typeof Utils !== 'undefined' && Utils.resetPassword) {
                    await Utils.resetPassword(email);
                    showToast(document.documentElement.lang === 'en' ? 'Reset link sent to your email!' : 'تم إرسال رابط إعادة التعيين لبريدك!', 'success');
                    closeForgotModal();
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function handleGoogleLogin() {
            try {
                if (typeof Utils !== 'undefined' && Utils.loginWithGoogle) {
                    await Utils.loginWithGoogle();
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>

</html>
