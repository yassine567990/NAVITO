<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title data-i18n="menu_products">المنتجات | لوحة الإدارة</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <!-- Theme & Language Persistence Script - Prevents Flash -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.className = savedTheme + '-mode';

            const savedLang = localStorage.getItem('navito_language') || 'ar';
            document.documentElement.lang = savedLang;

            if (savedLang === 'en') {
                document.write('<style id="i18n-hide-body">body { opacity: 0 !important; }</style>');
                setTimeout(function () {
                    document.documentElement.classList.add('i18n-ready');
                }, 1500);
            } else {
                document.documentElement.classList.add('i18n-ready');
            }
        })();
    </script>
    <style>
        .admin-body {
            font-family: var(--font-arabic);
        }
    </style>
</head>

<body class="admin-body">

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <button class="sidebar-close-btn" onclick="document.querySelector('.admin-sidebar').classList.remove('active')">✕</button>
            <div class="sidebar-header">
                <span style="font-size: 1.5rem;">🛍️</span>
                <span data-i18n="admin_panel">لوحة الإدارة</span>
            </div>

            <ul class="sidebar-menu">
                <li>
                    <a href="admin.html">
                        <span>📊</span> <span data-i18n="menu_dashboard">لوحة المعلومات</span>
                    </a>
                </li>
                <li>
                    <a href="products.html" class="active">
                        <span>📦</span> <span data-i18n="menu_products">المنتجات</span>
                    </a>
                </li>
                <li>
                    <a href="sales.html">
                        <span>💰</span> <span data-i18n="menu_sales">المبيعات</span>
                    </a>
                    <!-- Submenu for Sales (Hidden by default) -->

                </li>
                <li>
                    <a href="index.html" target="_blank">
                        <span>🏪</span> <span data-i18n="menu_store">المتجر</span>
                    </a>
                </li>
            </ul>

            <ul class="sidebar-menu" style="flex: 0; margin-top: auto;">
                <li>
                    <a href="javascript:void(0)" onclick="adminLogout()" class="logout-btn-premium" style="color: var(--danger-color);">
                        <span>🚪</span> <span data-i18n="logout">تسجيل الخروج</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header" style="margin-bottom: 0.75rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button id="sidebar-toggle" class="sidebar-toggle-btn">☰</button>
                    <h2 data-i18n="products_management" style="font-size: 1.5rem; margin-bottom: 0;">إدارة المنتجات</h2>
                    <div class="luxury-badge" style="padding: 0.25rem 0.75rem; margin: 0; transform: scale(0.85); transform-origin: right;">
                        <span data-i18n="total_products" style="font-size: 0.8rem; opacity: 0.8;">إجمالي</span>
                        <span id="total-products-count" class="badge-number" style="width: 20px; height: 20px; font-size: 0.7rem;">0</span>
                    </div>
                </div>
                <div class="header-actions" style="display: flex; align-items: center; gap: 0.5rem;">
                    <button onclick="openModal()" class="btn-premium-add"
                        style="display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.9rem; font-size: 0.85rem;">
                        <span>+</span> <span data-i18n="add_new_product">إضافة منتج</span>
                    </button>
                    <!-- Theme Toggle -->
                    <div class="nav-item-luxury" id="theme-toggle" onclick="toggleTheme()"
                        style="height: 34px; min-width: 120px; padding: 0 0.5rem;">
                        <div class="icon-display" id="theme-icon" style="font-size: 0.85rem;">☀️</div>
                        <span id="theme-text" data-i18n="light_mode" style="font-size: 0.75rem;">الوضع النهاري</span>
                    </div>

                    <!-- Language Toggle -->
                    <div class="nav-item-luxury" id="lang-toggle" onclick="toggleLanguage()"
                        style="height: 34px; min-width: 80px; padding: 0 0.5rem;">
                        <div class="icon-display" style="font-size: 0.85rem;">🌐</div>
                        <span id="lang-text" style="font-weight: 700; font-size: 0.75rem;">EN</span>
                    </div>
                </div>
            </div>

            <!-- Category Statistics Summary -->
            <div id="category-summary-container" class="admin-stats-summary"
                style="display: flex; gap: 1rem; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 0.5rem;">
                <!-- Dynamically populated by admin.js -->
            </div>

            <section id="products-section">
                <!-- Add Product Form (Hidden by default) -->
                <!-- Add Product Modal -->
                <div id="product-modal" class="modal-overlay">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3 class="modal-title" data-i18n="modal_title">إضافة / تعديل منتج</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <form id="product-form">
                            <input type="hidden" id="product-id">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-bottom: 1rem;">
                                <div class="form-group">
                                    <label class="form-label" data-i18n="product_name">اسم المنتج</label>
                                    <input type="text" id="name" class="form-input" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="product_name_en">اسم المنتج (إنجليزي)</label>
                                    <input type="text" id="nameEn" class="form-input">
                                </div>
                            </div>

                            <div
                                style="display:grid; grid-template-columns: repeat(4, 1fr); gap:1rem; margin-bottom: 1rem;">
                                <div class="form-group">
                                    <label class="form-label" data-i18n="price">السعر ($)</label>
                                    <input type="text" inputmode="decimal" id="price" class="form-input" required
                                        style="direction: ltr;" lang="en" placeholder="0.00">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="stock">المخزون</label>
                                    <input type="number" id="stock" class="form-input" value="0" min="0" required
                                        style="direction: ltr;" lang="en">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="rating">التقييم (1-5)</label>
                                    <input type="number" id="rating" class="form-input" value="5" min="1" max="5"
                                        step="0.1" style="direction: ltr;" lang="en">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="review_count">عدد المقيّمين</label>
                                    <input type="number" id="review_count" class="form-input" value="0" min="0"
                                        style="direction: ltr;" lang="en">
                                </div>
                            </div>

                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-bottom: 1rem;">
                                <div class="form-group">
                                    <label class="form-label" data-i18n="category">التصنيف</label>
                                    <select id="category" class="form-input" style="appearance: none;">
                                        <option value="" data-i18n="select_category">اختر تصنيف...</option>
                                        <option value="مكياج" data-i18n="makeup">مكياج</option>
                                        <option value="عناية بالبشرة" data-i18n="skincare">عناية بالبشرة</option>
                                        <option value="عطور" data-i18n="perfumes">عطور</option>
                                        <option value="العناية بالشعر" data-i18n="haircare">العناية بالشعر</option>
                                        <option value="أدوات المكياج" data-i18n="makeup_tools">أدوات المكياج</option>
                                        <option value="العروض" data-i18n="category_offers">العروض</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="shipping_cost">تكلفة الشحن ($)</label>
                                    <input type="text" inputmode="decimal" id="shipping" class="form-input" value="0"
                                        style="direction: ltr;" lang="en" placeholder="0.00">
                                </div>
                            </div>



                            <div class="form-group">
                                <label class="form-label" data-i18n="main_image">الصورة الرئيسية</label>
                                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
                                    <button type="button" class="btn-secondary" onclick="toggleImageMode('upload')"
                                        id="btn-upload-mode" style="flex: 1; padding: 0.5rem;">
                                        <span data-i18n="upload_from_device">📁 رفع من الجهاز</span>
                                    </button>
                                    <button type="button" class="btn-secondary" onclick="toggleImageMode('url')"
                                        id="btn-url-mode" style="flex: 1; padding: 0.5rem;">
                                        <span data-i18n="url_link">🔗 رابط URL</span>
                                    </button>
                                </div>

                                <div id="upload-mode-section" style="display: none;">
                                    <input type="file" id="image-file" class="form-input" accept="image/*"
                                        onchange="handleImageUpload(event, 'main')">
                                </div>

                                <div id="url-mode-section" style="display: block;">
                                    <input type="url" id="image" class="form-input">
                                </div>

                                <div id="image-preview" style="margin-top: 1rem; display: none;">
                                    <img id="preview-img" src="" alt="Preview"
                                        style="max-width: 100%; max-height: 200px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" data-i18n="additional_images">صور إضافية (اختياري)</label>
                                <div id="additional-images-container"
                                    style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;">
                                    <div class="additional-image-item">
                                        <input type="file" class="form-input additional-image-input" accept="image/*"
                                            onchange="handleImageUpload(event, 'additional', 0)"
                                            style="font-size: 0.85rem; padding: 0.5rem;">
                                    </div>
                                    <div class="additional-image-item">
                                        <input type="file" class="form-input additional-image-input" accept="image/*"
                                            onchange="handleImageUpload(event, 'additional', 1)"
                                            style="font-size: 0.85rem; padding: 0.5rem;">
                                    </div>
                                    <div class="additional-image-item">
                                        <input type="file" class="form-input additional-image-input" accept="image/*"
                                            onchange="handleImageUpload(event, 'additional', 2)"
                                            style="font-size: 0.85rem; padding: 0.5rem;">
                                    </div>
                                    <div class="additional-image-item">
                                        <input type="file" class="form-input additional-image-input" accept="image/*"
                                            onchange="handleImageUpload(event, 'additional', 3)"
                                            style="font-size: 0.85rem; padding: 0.5rem;">
                                    </div>
                                </div>
                                <div id="additional-previews"
                                    style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 0.75rem;">
                                </div>
                            </div>

                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-bottom: 1rem;">
                                <div class="form-group">
                                    <label class="form-label" data-i18n="description">الوصف (عربي)</label>
                                    <textarea id="description" class="form-input" rows="4"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" data-i18n="description_en">الوصف (إنجليزي)</label>
                                    <textarea id="descriptionEn" class="form-input" rows="4"></textarea>
                                </div>
                            </div>

                            <div class="modal-actions">
                                <button type="submit" id="submit-btn" class="btn-primary" style="flex:1;"><span
                                        data-i18n="save_product">حفظ
                                        المنتج</span></button>
                                <button type="button" class="btn-danger" onclick="closeModal()"><span
                                        data-i18n="cancel">إلغاء</span></button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="glass-table-wrapper">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;" data-i18n="col_image">الصورة</th>
                                <th data-i18n="col_name">الاسم</th>
                                <th data-i18n="col_category">التصنيف</th>
                                <th data-i18n="col_price">السعر</th>
                                <th data-i18n="col_stock">المخزون</th>
                                <th data-i18n="actions">العمليات</th>
                            </tr>
                        </thead>
                        <tbody id="products-list">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>

                <div id="products-grid-admin" style="display: none;">
                    <!-- Legacy container hidden -->
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- LocalStorage Mode - No Firebase needed -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="utils.js"></script>
    <script src="i18n.js?v=1.1"></script>
    <script src="admin.js?v=2.0"></script>

</body>

</html>
